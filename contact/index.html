<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — ENMARS</title>
  <meta name="description" content="ENMARS — precision manufacturing for perfumery sampling. Fully assembled perfume vials, discovery sets and custom sampling projects from a specialised European network.">
  <meta property="og:title" content="Contact — ENMARS">
  <meta property="og:description" content="ENMARS — precision manufacturing for perfumery sampling. Fully assembled perfume vials, discovery sets and custom sampling projects from a specialised European network.">
  <meta property="og:image" content="https://enmars.eu/assets/img/hero-home.jpg">
  <link rel="icon" href="/assets/img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="/" aria-label="ENMARS home"><img src="/assets/img/logo.jpg" alt="ENMARS"></a>
      <button class="menu-btn" aria-label="Menu" aria-expanded="false">&#9776;</button>
      <nav class="nav">
        <a href="/solutions/">Solutions</a>
        <a href="/our-industries/">Industries</a>
        <a href="/production-process/">Production Process</a>
        <a href="/sustainability/">Sustainability</a>
        <a href="/contact/" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page">
      <div class="wrap contact-grid">
        <div>
          <h1>Contact Us</h1>
          <p><a href="mailto:info@enmars.eu" style="text-decoration:none">info@enmars.eu</a><br><a href="tel:+34611413084" style="text-decoration:none">+34 611 413 084</a></p>
        <form class="form" action="https://formsubmit.co/rokas@enmars.eu" method="POST">
          <input type="hidden" name="_cc" value="lucas@enmars.eu">
          <input type="hidden" name="_subject" value="New enquiry from enmars.eu">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="_next" value="https://enmars.eu/thanks/">
          <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off">
          <div class="legend">Name</div>
          <div class="row">
            <div class="field"><label for="fname">First name <span class="req">(required)</span></label><input id="fname" name="First name" type="text" autocomplete="given-name" required></div>
            <div class="field"><label for="lname">Last name <span class="req">(required)</span></label><input id="lname" name="Last name" type="text" autocomplete="family-name" required></div>
          </div>
          <div class="field"><label for="email">E-mail <span class="req">(required)</span></label><input id="email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="message">Message <span class="req">(required)</span></label><textarea id="message" name="Message" required></textarea></div>
          <button class="btn" type="submit">Send</button>
          <div class="form-status" role="status"></div>
        </form>
        </div>
        <img src="/assets/img/contact-building.png" alt="ENMARS facility sketch" loading="lazy" style="margin-top:60px">
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="brand">ENMARS</div>
      <div>
        <h4>Contact</h4>
        <a href="mailto:info@enmars.eu">info@enmars.eu</a>
        <a href="tel:+34611413084">+34 611 413 084</a>
      </div>
    </div>
  </footer>
  <script src="/assets/js/main.js"></script>
</body>
</html>
